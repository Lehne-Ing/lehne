title: Verkehrsplaner / Projektleiter (m/w/d)für nachhaltige Mobilität und Infrastruktur



description:  Verkehrsplaner / Projektleiter (m/w/d) bei LEHNE ing. planst und überwachst Du ab dem ersten Tag spannende Bauprojekte in den Bereichen nachhaltige Infrastruktur, Energie, Umwelttechnik und Mobilität. Dabei kannst Du Dich aktiv bei komplexen Planungsprozessen einbringen und wegweisende Lösungen kreieren.
aufgaben:
  - Als Projektleiter übernimmst Du die Planung von Verkehrsanlagen in den Leistungsphasen 1–8 der HOAI
  - Du bearbeitest und leitest abwechslungsreiche Projekte im innerstädtischen Straßenraum, im Radverkehr sowie im Bereich übergeordneter Verkehrswege 
  - Du koordinierst die Zusammenarbeit mit Auftraggebern, Behörden und weiteren Projektpartnern und bringst Projekte erfolgreich voran 
  - Zusätzlich fühlst Du Dich mitverantwortlich für eine erfolgreiche und wirtschaftliche Umsetzung der Projekte
profil:
  - Du hast ein abgeschlossenes Studium im Bereich Bauingenieurwesen, Verkehrswesen, Verkehrsplanung oder einer vergleichbaren Fachrichtung
  - Idealerweise verfügst Du über mehrjährige Berufserfahrung in der Verkehrsplanung
  - Du bringst Kenntnisse der HOAI-Leistungsphasen und der einschlägigen technischen Regelwerke mit
  - Der souveräne Umgang mit CAD-Anwendungen und MS Office ist für Dich selbstverständlich
  - Sehr gute Deutschkenntnisse in Wort und Schrift sowie idealerweise erste Erfahrungen in der Projektleitung runden Dein Profil ab
angebot:
  - Arbeite an Projekten, die die Mobilität und Lebensqualität in Metropolregionen wie Hamburg nachhaltig verändern und resilienter machen
  - Freue dich auf flexible Arbeitszeiten, einen attraktiven Arbeitsplatz in Hamburg-St. Georg mit hervorragender Verkehrsanbindung und Alsterblick
  - Ein vertrauensvolles Miteinander, kurze Kommunikationswege und persönliches Mentoring bilden die Grundlage unseres gemeinsamen Erfolgs
  - Neben einer attraktiven, leistungsgerechten Vergütung entsprechend Deiner Erfahrung und Verantwortung erwarten dich Benefits wie Urban Sports Club, das Deutschlandticket und gemeinsame Teamreisen im Sommer und Winter
