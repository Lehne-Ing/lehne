title: Traffic Planner / Project Manager (m/f/d) for sustainable infrastructure and enviromental engineering

description:  Traffic Planner / Project Manager (m/f/d) at LEHNE ing., you will plan and supervise exciting construction projects in the fields of sustainable infrastructure and mobility from day one. You can actively participate in complex planning processes and create groundbreaking solutions.

aufgaben:
  - As a project manager, you will be responsible for planning traffic infrastructure projects during service phases 1–8 of the HOAI
  - You will work on and lead diverse projects in inner-city road networks, bicycle traffic, and major transportation corridors
  - You will coordinate collaboration with clients, government agencies, and other project partners and successfully drive projects forward
  - In addition, you will feel a sense of shared responsibility for the successful and cost-effective implementation of the projects
profil:
  - You have a degree in civil engineering, traffic engineering, traffic planning, or a related field
  - Ideally, you have several years of professional experience in traffic planning
  - You have knowledge of the HOAI project phases and the relevant technical regulations
  - You are fully proficient in CAD applications and MS Office
  - Excellent written and spoken German, as well as, ideally, some initial experience in project management, round off your profile
angebot:
  - Work on projects that bring about sustainable change to mobility and quality of life in metropolitan regions such as Hamburg, making them more resilient
  - Look forward to flexible working hours, an attractive workplace in Hamburg-St. Georg with excellent transport links and views of the Alster
  - A culture of mutual trust, short lines of communication and personalised mentoring form the basis of our shared success
  - In addition to an attractive, performance-based salary commensurate with your experience and responsibilities, you can look forward to benefits such as Urban Sports Club, the Deutschlandticket and team trips in summer and winter